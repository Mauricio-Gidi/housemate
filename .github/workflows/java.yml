name: Java verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile for Java 17
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          mapfile -d '' sources < <(find cscie97 tests -type f -name '*.java' -print0)
          test "${#sources[@]}" -gt 0
          javac --release 17 -encoding UTF-8 -d build "${sources[@]}"

      - name: Test token lifecycle
        shell: bash
        run: |
          set -euo pipefail
          java -Dhousemate.tokenTimeoutSeconds=2 -cp build tests.TokenLifecycleTest | tee token-output.txt
          grep -Fq 'ALL TOKEN TESTS PASSED' token-output.txt

      - name: Integration smoke test
        shell: bash
        run: |
          set -euo pipefail
          java -cp build cscie97.asn4.housemate.test.TestDriver housemate3.txt > scenario-output.txt 2>&1
          if grep -Fq 'Script failed:' scenario-output.txt; then
            tail -100 scenario-output.txt
            exit 1
          fi
          grep -Fq 'OvenTimerCommand: Command executed successfully' scenario-output.txt
          grep -Fq 'FireModeCommand: Command executed successfully' scenario-output.txt
          grep -Fq 'Access denied: control_light on house1:livingroom:light1_2' scenario-output.txt
          echo 'Integration smoke-test checkpoints found.'
