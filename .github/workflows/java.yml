name: Java build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile
        run: |
          mkdir -p build
          find cscie97 -name '*.java' -print0 | xargs -0 javac -d build
      - name: Run demonstration
        run: |
          java -cp build cscie97.asn2.housemate.test.TestDriver examples/housemate_demo.txt | tee demo-output.txt
          grep -q 'FireModeCommand: Command executed successfully' demo-output.txt
          grep -q 'OvenTimerCommand: Command executed successfully' demo-output.txt
          if grep -q '\[FAIL\]\|\[PARTIAL\]' demo-output.txt; then exit 1; fi
      - name: Run full scenario
        run: |
          java -cp build cscie97.asn2.housemate.test.TestDriver examples/housemate_full_scenario.txt > full-output.txt 2>&1
          grep -q 'Command executed successfully' full-output.txt
